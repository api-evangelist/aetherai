  detail: >-
    aetherAI sells FDA-cleared digital-pathology software (aetherSlide, aetherWeb, Hema, Endo,
    Ortho) only as an end-user clinical product — there is no developer program, no developer
    portal, no OpenAPI and no API documentation on any host, and the DPAI application at
