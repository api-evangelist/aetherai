apis:
  - name: aetherAI Site MCP
    description: >-
      A live, anonymous Model Context Protocol endpoint served from aetherAI's own host. It exposes
      nine tools over JSON-RPC 2.0 (streamable HTTP) for reading business details, searching site
      content, browsing Wix API documentation, minting an anonymous visitor token, and calling or
      executing Wix site APIs on a visitor's behalf. It is the Wix platform "Site MCP" — the tool
      set is authored by the website host, not by aetherAI — and it reaches the marketing site's
      content and commerce surface, NOT aetherSlide, aetherWeb, Hema, Endo or Ortho. Recorded
      because it is genuinely reachable with no credentials, and qualified because it is not a
      product API.
    humanURL: https://www.aetherai.com/llms.txt
