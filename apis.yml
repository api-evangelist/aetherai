aid: aetherai
name: aetherAI
description: >-
  aetherAI (雲象科技, aetherAI Co., Ltd.) is a Taipei-based medical-imaging AI company and one of
  Asia's leading digital-pathology vendors. It builds regulated diagnostic software for hospitals,
  reference laboratories and pharmaceutical R&D: aetherSlide, an FDA-cleared (K233126), CE-marked
  and TFDA-approved whole-slide image management and viewing system; aetherWeb, a cloud digital
  pathology education platform; aetherAI Hema for bone-marrow smear differential counting;
  aetherAI Endo for real-time computer-aided polyp detection in colonoscopy; and aetherAI Ortho for
  whole-spine radiograph measurement. The company was founded in Taiwan, raised NT$765 million in
  Series B funding led by CDIB Capital, Quanta Computer, Taiwan Business Bank VC and Cathay Venture,
  listed on Taiwan's Emerging Stock Board in November 2024, holds ISO/IEC 27001 certification, and
  has filed for the Taiwan Innovation Board. aetherAI publishes no public developer API, no OpenAPI
  or other machine-readable contract, and no developer portal; its clinical software is sold and
  deployed through a direct enterprise motion and its application sits behind a customer login. The
  single publicly callable surface is a Wix-provided Site MCP endpoint on its own domain, which
  serves website content rather than any clinical product.
