source: https://www.aetherai.com/_api/mcp
name: aetherAI Site MCP Server
summary: >-
  A live, anonymous Model Context Protocol server served from aetherAI's own host at
  https://www.aetherai.com/_api/mcp. It is the ONLY machine-readable API surface aetherAI
  exposes to the public. It is the Wix "Site MCP" — platform-authored by the website host,
  not written by aetherAI — and it exposes the CONTENT AND COMMERCE SURFACE OF THE WEBSITE
  (business details, site search, Wix business-solution APIs), NOT the company's clinical
  products. aetherSlide, aetherWeb, aetherAI Hema, aetherAI Endo and aetherAI Ortho publish
  no public API, no OpenAPI, and no developer documentation (see x-coverage in apis.yml).

